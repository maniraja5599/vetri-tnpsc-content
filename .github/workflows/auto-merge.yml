# Merges daily current-affairs PRs automatically when verified.
# Merges only if:
#   - the reviewer routine (or the owner) commented "VERIFIED <latest commit sha>",
#     or the owner added the "verified" label, and
#   - .github/check.js passes.
name: Auto-merge daily current affairs

on:
  schedule:
    # 02:15 UTC = 07:45 AM IST (Off-peak auto-merge before morning quiz)
    - cron: '15 2 * * *'
    # 06:25 UTC = 11:55 AM IST (Midday catch-up)
    - cron: '25 6 * * *'
    # 14:20 UTC = 07:50 PM IST (Off-peak auto-merge before evening quiz)
    - cron: '20 14 * * *'
  pull_request_target:
    types: [opened, synchronize, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # keyless Google auth for push alerts (no secret)

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # Always run main's check scripts, never the copy inside a PR,
      # so a PR cannot weaken the checks that decide whether it merges.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # Short-lived Google credentials for FCM via Workload Identity
      # Federation. Only this repository may use them (pool condition).
      # If it fails, merges still happen; only the push alert is skipped.
      - name: Google auth (keyless)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/881604606258/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@vetri-tnpsc.iam.gserviceaccount.com

      - name: Check and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional fallback if keyless auth is not available.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cp .github/check.js .github/approved.js scripts/notify_push.py /tmp/
          pip install -q google-auth requests || true
          gh label create hold --color B60205 --description "Do not auto-merge" --force >/dev/null
          prs=$(gh pr list --state open --base main --json number,headRefName,title,labels \
            --jq '[.[] | select(.headRefName | startswith("ca-")) | select(.title | startswith("Current affairs")) | select([.labels[].name] | index("hold") | not)] | sort_by(.number) | .[].number')
          if [ -z "$prs" ]; then echo "No PR to merge."; exit 0; fi
          for n in $prs; do
            echo "::group::PR #$n"
            git fetch -q origin main "pull/$n/head:pr-$n"
            files=$(git diff --name-only origin/main...pr-$n)
            if [ "$files" != "content.json" ]; then
              gh pr comment "$n" -b "Not auto-merged: this PR changes files other than content.json."
              gh pr edit "$n" --add-label hold
            elif ! gh pr view "$n" --json headRefOid,comments,labels | node /tmp/approved.js "${{ github.repository_owner }}"; then
              echo "PR #$n has no VERIFIED comment for its latest commit yet, skipping."
            elif git show origin/main:content.json > /tmp/base.json && git show pr-$n:content.json > /tmp/new.json && node /tmp/check.js /tmp/base.json /tmp/new.json; then
              if gh pr merge "$n" --squash --delete-branch; then
                git fetch -q origin main
                echo "Merged #$n"
                # A merge with GITHUB_TOKEN does not start other workflows,
                # so the push alert is sent from here. Never fails the job.
                python /tmp/notify_push.py /tmp/base.json /tmp/new.json || echo "Push alert failed (ignored)."
              else
                gh pr comment "$n" -b "Not auto-merged: merge failed (probably a conflict with main)."
                gh pr edit "$n" --add-label hold
              fi
            else
              gh pr comment "$n" -b "Not auto-merged: the content check failed. See the Actions log."
              gh pr edit "$n" --add-label hold
            fi
            echo "::endgroup::"
          done
