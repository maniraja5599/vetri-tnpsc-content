# Push alert to app users when the owner merges or pushes a content.json
# change (news or new questions). Merges done by the auto-merge workflow use
# GITHUB_TOKEN and do not trigger this; that workflow sends its own alert.
name: Push alert for new content

on:
  push:
    branches: [main]
    paths: ['content.json']
  # Actions tab → "Run workflow": sends one test alert to every install.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless Google auth for push alerts (no secret)

# No concurrency group on purpose: GitHub would replace a pending run with a
# newer one, and that run's "before" already includes the older change, so
# its alert would be lost. Each push compares only its own before/after.

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Short-lived Google credentials via Workload Identity Federation;
      # only this repository may use them. If it fails, no alert is sent.
      - name: Google auth (keyless)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/881604606258/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@vetri-tnpsc.iam.gserviceaccount.com

      - name: Send alert if news or questions were added
        env:
          # Optional fallback if keyless auth is not available.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BEFORE: ${{ github.event.before }}
        run: |
          pip install -q google-auth requests
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/notify_push.py --test; exit $?
          fi
          # Compare with main before this push (covers pushes of several commits).
          if ! git show "$BEFORE:content.json" > /tmp/old.json 2>/dev/null; then
            echo "No previous content.json: skipping."; exit 0
          fi
          python scripts/notify_push.py /tmp/old.json content.json
