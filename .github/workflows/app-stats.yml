# Writes usage counts (sign-ups, active users, backups, content version) to
# Firestore stats/summary for the owner-only admin dashboard in the app.
name: App stats for admin dashboard

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless Google auth (no secret)

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Google auth (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/881604606258/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: firebase-adminsdk-fbsvc@vetri-tnpsc.iam.gserviceaccount.com

      - name: Update stats/summary
        run: |
          pip install -q google-auth requests
          python scripts/update_stats.py
